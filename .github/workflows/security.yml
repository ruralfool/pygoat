name: Security Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- BUILD: установка зависимостей ----
      - name: Build (install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      # ---- SAST #1: Bandit (анализ Python-кода) ----
      - name: SAST - Bandit
        run: |
          pip install bandit
          bandit -r . -x ./tests -f txt  -o bandit-report.txt  || true
          bandit -r . -x ./tests -f json -o bandit-report.json || true

      # ---- SAST #2: Semgrep (мультиязычный анализ кода) ----
      - name: SAST - Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/django --output semgrep-report.txt  || true
          semgrep scan --config p/python --config p/django --json --output semgrep-report.json || true

      # ---- SCA: Trivy (анализ зависимостей на известные CVE) ----
      - name: SCA - Trivy (table to log)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM

      - name: SCA - Trivy (json report)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM

      # ---- EXPORT: отчёты как артефакты ----
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.*
            semgrep-report.*
            trivy-report.json
